<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Due for Review · Wasatch Board Co. ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="content" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2>Reorder points, EOQ and periodic review</h2>
        <div class="toolbar" style="margin:0">
          <select id="f-show" aria-label="Which items to show">
            <option value="due">Due for review</option>
            <option value="reorder">Reorder now (on hand + on order ≤ reorder point)</option>
            <option value="all">All items</option>
          </select>
          <select id="f-type" aria-label="Item type">
            <option value="part">Parts</option>
            <option value="complete">Complete boards</option>
            <option value="">Parts and boards</option>
          </select>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th><input type="checkbox" id="tick-all" aria-label="Tick every row"></th>
          <th>SKU</th><th>Item</th><th>Supplier</th>
          <th class="num">On hand</th><th class="num">On order</th>
          <th class="num">Daily usage (d)</th><th class="num">Std dev (σ)</th><th class="num">Lead time (L)</th>
          <th class="num">Safety stock</th><th class="num">Reorder point</th><th class="num">EOQ</th>
          <th class="num">Days of stock</th><th>Status</th><th>Next review</th><th class="num">Order qty</th>
        </tr></thead>
        <tbody id="plan-body"><tr><td colspan="16" class="muted">Loading…</td></tr></tbody>
      </table></div>
      <p class="error-text" id="plan-error" role="alert"></p>
      <div class="form-actions">
        <button class="btn" id="mark-btn">Mark ticked as reviewed</button>
        <button class="btn primary" id="po-btn">Create draft POs for ticked parts</button>
      </div>
      <p class="muted" id="formula-note"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const me = await WBC.initPage('Due for Review');
      if (!me) return;
      const { sb, esc, qty, date, dateOf, poNumber, toast, createDraftPOs, openDraftPOs } = WBC;
      const $ = (id) => document.getElementById(id);

      let rows = [];             // rows from the item_planning view
      let supplierName = new Map();
      let settings = new Map();
      let ticked = new Set();    // item ids that are ticked
      let orderQty = new Map();  // item id -> order quantity typed by the user

      const num = (value, digits = 1) => Number(value || 0).toLocaleString('en-US', { maximumFractionDigits: digits });

      async function load() {
        const [planRes, supRes, setRes] = await Promise.all([
          sb.from('item_planning').select('*').order('sku'),
          sb.from('suppliers').select('id, name'),
          sb.from('settings').select('key, value'),
        ]);
        if (planRes.error) {
          toast(planRes.error.message + ' — has sql/11_planning.sql been run?', true);
          $('plan-body').innerHTML = '<tr><td colspan="16" class="muted">Could not load planning numbers.</td></tr>';
          return;
        }
        rows = planRes.data;
        supplierName = new Map((supRes.data || []).map((s) => [s.id, s.name]));
        settings = new Map((setRes.data || []).map((s) => [s.key, Number(s.value)]));
        $('formula-note').textContent =
          `Usage = units sold + units issued to production, averaged over the last ${num(settings.get('usage_window_days'), 0)} days. ` +
          `Safety stock = z × σ × √L (z = ${settings.get('service_level_z')}). Reorder point = d × L + safety stock. ` +
          `"Reorder now" when on hand + on order ≤ reorder point (stock already on a sent PO counts). ` +
          `EOQ = √(2DS / H), with D = the last 365 days of usage, S = $${settings.get('ordering_cost')} per order and ` +
          `H = ${num(settings.get('holding_rate') * 100, 0)}% of unit cost. The order quantity is the EOQ rounded up to a whole unit. Change these on the Settings page.`;
        render();
      }

      function visibleRows() {
        const show = $('f-show').value, type = $('f-type').value;
        return rows.filter((r) => (!type || r.item_type === type)
          && (show === 'all' || (show === 'due' && r.review_due) || (show === 'reorder' && r.needs_reorder)));
      }

      function render() {
        const list = visibleRows();
        $('plan-body').innerHTML = list.map((r) => {
          const isPart = r.item_type === 'part';
          const amount = orderQty.has(r.item_id) ? orderQty.get(r.item_id) : (r.needs_reorder ? r.suggested_qty : '');
          return `<tr data-item="${r.item_id}">
            <td><input type="checkbox" class="tick" ${ticked.has(r.item_id) ? 'checked' : ''} aria-label="Tick ${esc(r.sku)}"></td>
            <td class="nowrap">${esc(r.sku)}</td><td>${esc(r.name)}</td>
            <td>${isPart ? esc(supplierName.get(r.supplier_id) || '') : '<span class="muted">Built in house</span>'}</td>
            <td class="num">${qty(r.on_hand)}</td>
            <td class="num">${qty(r.on_order)}</td>
            <td class="num">${num(r.avg_daily_usage, 2)}</td>
            <td class="num">${num(r.sd_daily_usage, 2)}</td>
            <td class="num">${esc(r.lead_time_days)} d</td>
            <td class="num">${num(r.safety_stock)}</td>
            <td class="num"><strong>${num(r.reorder_point)}</strong></td>
            <td class="num">${r.eoq === null ? '—' : num(r.eoq, 1)}</td>
            <td class="num">${r.days_of_stock === null ? '—' : num(r.days_of_stock, 0)}</td>
            <td class="nowrap">${r.needs_reorder
              ? `<span class="bad-text">${isPart ? 'Reorder now' : 'Build now'}</span>`
              : Number(r.on_hand) <= Number(r.reorder_point)
                ? `<span class="ok-text">OK</span><br><span class="muted">${isPart ? 'on order' : 'being built'} covers it</span>`
                : '<span class="ok-text">OK</span>'}</td>
            <td class="nowrap">${r.last_reviewed_at
              ? (r.review_due ? `<span class="bad-text">${esc(date(r.next_review_date))}</span>` : esc(date(r.next_review_date)))
              : '<span class="bad-text">Never reviewed</span>'}
              <br><span class="muted">every ${esc(r.review_interval_days)} d${r.last_reviewed_at ? ' · last ' + esc(dateOf(r.last_reviewed_at)) : ''}</span></td>
            <td class="num">${isPart
              ? `<input class="qty order-qty" type="number" min="0" step="1" value="${esc(amount)}" placeholder="0" aria-label="Order quantity for ${esc(r.sku)}">`
              : '<span class="muted">see MRP</span>'}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="16" class="muted">Nothing to show for this filter.</td></tr>';
        $('tick-all').checked = list.length > 0 && list.every((r) => ticked.has(r.item_id));
      }

      $('f-show').addEventListener('change', render);
      $('f-type').addEventListener('change', render);
      $('tick-all').addEventListener('change', () => {
        visibleRows().forEach((r) => { if ($('tick-all').checked) ticked.add(r.item_id); else ticked.delete(r.item_id); });
        render();
      });
      $('plan-body').addEventListener('change', (event) => {
        const row = event.target.closest('[data-item]');
        if (!row) return;
        const id = Number(row.dataset.item);
        if (event.target.classList.contains('tick')) {
          if (event.target.checked) ticked.add(id); else ticked.delete(id);
        }
      });
      $('plan-body').addEventListener('input', (event) => {
        const row = event.target.closest('[data-item]');
        if (row && event.target.classList.contains('order-qty')) {
          orderQty.set(Number(row.dataset.item), event.target.value);
          ticked.add(Number(row.dataset.item));       // typing a quantity ticks the row
          row.querySelector('.tick').checked = true;
        }
      });

      const tickedRows = () => visibleRows().filter((r) => ticked.has(r.item_id));

      // Stamp "reviewed now" on the items, which moves their next review date forward.
      async function markReviewed(ids) {
        if (!ids.length) return null;
        const { error } = await sb.from('items').update({ last_reviewed_at: new Date().toISOString() }).in('id', ids);
        return error;
      }

      $('mark-btn').addEventListener('click', async () => {
        $('plan-error').textContent = '';
        const ids = tickedRows().map((r) => r.item_id);
        if (!ids.length) { $('plan-error').textContent = 'Tick at least one item.'; return; }
        const error = await markReviewed(ids);
        if (error) { $('plan-error').textContent = error.message; return; }
        toast(ids.length + (ids.length === 1 ? ' item' : ' items') + ' marked as reviewed.');
        ticked = new Set(); orderQty = new Map();
        await load();
      });

      $('po-btn').addEventListener('click', async () => {
        $('plan-error').textContent = '';
        const lines = tickedRows().filter((r) => r.item_type === 'part').map((r) => ({
          supplier_id: r.supplier_id, item_id: r.item_id, unit_cost: Number(r.standard_cost || 0),
          qty: Number(orderQty.has(r.item_id) ? orderQty.get(r.item_id) : (r.needs_reorder ? r.suggested_qty : 0)),
        })).filter((l) => l.qty > 0);
        if (!lines.length) { $('plan-error').textContent = 'Tick at least one part and give it an order quantity.'; return; }

        $('po-btn').disabled = true;
        const { created, error } = await createDraftPOs(lines);
        $('po-btn').disabled = false;
        if (error) { $('plan-error').textContent = error.message; }
        if (created.length) {
          // Ordering a part counts as reviewing it.
          await markReviewed(lines.map((l) => l.item_id));
          if (!error) { openDraftPOs(created); return; }   // go straight to the new draft(s) in Purchasing
          toast('Draft ' + created.map(poNumber).join(', ') + ' created.');
          ticked = new Set(); orderQty = new Map();
        }
        await load();
      });

      await load();

      // Coming back to this tab (for example after changing a setting) recalculates.
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

      // Realtime: stock, purchase orders and item edits refresh the numbers.
      // (Skipped while someone is typing an order quantity.)
      let reloadTimer;
      const queueReload = () => {
        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(() => {
          const active = document.activeElement;
          if (active && active.matches('input.order-qty')) queueReload(); else load();
        }, 800);
      };
      sb.channel('review-page')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_levels' }, queueReload)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'purchase_orders' }, queueReload)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, queueReload)
        .subscribe();
    })();
  </script>
</body>
</html>
